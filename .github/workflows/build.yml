name: Build Mafix AI APK

on:
push:
branches:
- main
workflow_dispatch:

jobs:
build-android:
runs-on: ubuntu-latest
timeout-minutes: 45

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable
      cache: true

  - name: Install Android SDK 36
    shell: bash
    run: |
      set -e

      SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)

      if [ -z "$SDKMANAGER" ]; then
        echo "ERROR: Android sdkmanager not found"
        exit 1
      fi

      echo "Using SDK manager: $SDKMANAGER"

      set +o pipefail
      yes | "$SDKMANAGER" --licenses
      set -o pipefail

      "$SDKMANAGER" --install \
        "platform-tools" \
        "platforms;android-36" \
        "build-tools;36.0.0"

  - name: Configure App compileSdk 36
    shell: bash
    run: |
      set -e

      python3 - <<'PY'
      from pathlib import Path
      import re

      path = Path("android/app/build.gradle.kts")

      if not path.exists():
          raise SystemExit("ERROR: App Gradle file not found")

      content = path.read_text()

      pattern = r'(?m)^(\s*compileSdk\s*=\s*).+$'
      updated, count = re.subn(pattern, r'\g<1>36', content)

      if count == 0:
          if re.search(r'(?m)^\s*compileSdk\s*=\s*36\s*$', content):
              print("App compileSdk is already 36")
          else:
              raise SystemExit("ERROR: App compileSdk declaration not found")
      else:
          path.write_text(updated)

      print("App compileSdk configured successfully")

      PY

  - name: Get Flutter dependencies
    run: flutter pub get

  - name: Fix and verify file_picker Android SDK
    shell: bash
    run: |
      set -e

      python3 - <<'PY'
      from pathlib import Path
      import re

      cache = Path.home() / ".pub-cache/hosted/pub.dev"

      files = sorted(
          cache.glob("file_picker-*/android/build.gradle*")
      )

      if not files:
          raise SystemExit("ERROR: file_picker Android Gradle file not found")

      pattern = re.compile(
          r'(?m)^([ \t]*)(compileSdkVersion|compileSdk)([ \t]*(?:=[ \t]*)?).*$'
      )

      for path in files:
          content = path.read_text()

          updated, count = pattern.subn(
              lambda m: (
                  m.group(1) + m.group(2) + m.group(3) + "36"
              ),
              content
          )

          if count > 0:
              path.write_text(updated)
              content = updated
              print(f"Updated: {path}")
          else:
              print(f"No compileSdk declaration changed in: {path}")

          sdk_lines = [
              line.strip()
              for line in content.splitlines()
              if re.match(r'^\s*compileSdkVersion\b|^\s*compileSdk\b', line)
          ]

          if not sdk_lines:
              raise SystemExit(
                  f"ERROR: compileSdk declaration missing in {path}"
              )

          if not any(re.search(r'\b36\b', line) for line in sdk_lines):
              raise SystemExit(
                  f"ERROR: compileSdk was not changed to 36 in {path}. "
                  f"Found: {sdk_lines}"
              )

          print("Verified:", sdk_lines)

      PY

  - name: Verify Android configuration
    shell: bash
    run: |
      set -e

      echo "Checking Android SDK 36..."
      test -d "$ANDROID_HOME/platforms/android-36"
      test -d "$ANDROID_HOME/build-tools/36.0.0"

      echo "Checking app compileSdk..."
      grep -n "compileSdk" android/app/build.gradle.kts

      echo "Checking file_picker compileSdk..."
      find "$HOME/.pub-cache/hosted/pub.dev" \
        -path "*/file_picker-*/android/build.gradle*" \
        -type f \
        -exec grep -nE 'compileSdk(Version)?' {} \;

      flutter doctor -v

  - name: Build Mafix AI APK
    env:
      MAFIX_LIVE_TOKEN: ${{ secrets.LIVE_AUTH_TOKEN }}
    run: |
      flutter build apk --release \
        --dart-define=MAFIX_LIVE_TOKEN="$MAFIX_LIVE_TOKEN"

  - name: Verify APK
    shell: bash
    run: |
      set -e

      APK="build/app/outputs/flutter-apk/app-release.apk"

      if [ ! -f "$APK" ]; then
        echo "ERROR: APK was not generated"
        exit 1
      fi

      ls -lh "$APK"

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Mafix-AI-Android-APK
      path: build/app/outputs/flutter-apk/app-release.apk
      if-no-files-found: error
      retention-days: 14
