name: Build Mafix AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Generate Android project files
        run: flutter create --platforms=android .

      - name: Configure Android Compile SDK 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_file = Path("android/app/build.gradle.kts")
          root_file = Path("android/build.gradle.kts")

          if not app_file.exists():
              raise SystemExit("ERROR: App Gradle file not found")

          if not root_file.exists():
              raise SystemExit("ERROR: Root Gradle file not found")

          # Set app Compile SDK to 36
          app = app_file.read_text()

          app, count = re.subn(
              r'(?m)^(\s*)compileSdk\s*=.*$',
              r'\g<1>compileSdk = 36',
              app,
              count=1
          )

          if count == 0:
              raise SystemExit(
                  "ERROR: Could not find compileSdk in app Gradle file"
              )

          app_file.write_text(app)

          # Remove previous SDK override blocks
          root = root_file.read_text()

          root = re.sub(
              r'(?s)\n// Configure all Android modules to use Compile SDK 36.*',
              '',
              root
          )

          # Apply SDK 36 after every Android module has been evaluated.
          # Reflection avoids requiring AGP classes on the root script classpath.
          config = """

          // Force every Android module to use Compile SDK 36
          gradle.projectsEvaluated {
              rootProject.allprojects { project ->
                  def androidExtension = project.extensions.findByName("android")

                  if (androidExtension != null) {
                      def compileSdkSetter = androidExtension.class.methods.find {
                          it.name == "setCompileSdk" &&
                          it.parameterCount == 1 &&
                          (it.parameterTypes[0] == Integer.TYPE ||
                           it.parameterTypes[0] == Integer.class)
                      }

                      if (compileSdkSetter == null) {
                          throw new GradleException(
                              "Cannot set Compile SDK 36 for " + project.path
                          )
                      }

                      compileSdkSetter.invoke(androidExtension, 36)

                      println(
                          "MAFIX SDK FIX: " + project.path +
                          " configured with Compile SDK 36"
                      )
                  }
              }
          }
          """

          root += config
          root_file.write_text(root)

          print("SUCCESS: App Compile SDK set to 36")
          print("SUCCESS: Global Android module SDK override added")
          PY

      - name: Verify Android SDK configuration
        run: |
          echo "Checking app Compile SDK..."
          grep -n "compileSdk" android/app/build.gradle.kts

          echo "Checking global SDK override..."
          grep -n "Force every Android module" android/build.gradle.kts

      - name: Add Android Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit("ERROR: AndroidManifest.xml not found")

          content = manifest.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.INTERNET"/>'
          )

          if "android.permission.INTERNET" not in content:
              content = re.sub(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n    ' + permission,
                  content,
                  count=1
              )

          manifest.write_text(content)

          print("SUCCESS: Internet permission configured")
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          MAFIX_LIVE_TOKEN: ${{ secrets.LIVE_AUTH_TOKEN }}
        run: |
          if [ -z "$MAFIX_LIVE_TOKEN" ]; then
            echo "ERROR: LIVE_AUTH_TOKEN secret is missing."
            exit 1
          fi

          flutter build apk --release \
            --dart-define=MAFIX_LIVE_TOKEN="$MAFIX_LIVE_TOKEN"

      - name: Verify APK
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "SUCCESS: Mafix AI APK generated."
          ls -lh "$APK_PATH"

      - name: Upload Mafix AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Mafix-AI-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
