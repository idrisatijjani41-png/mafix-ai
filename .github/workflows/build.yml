name: Build Mafix AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Set App compileSdk to 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          content = path.read_text()

          updated, count = re.subn(
              r'(?m)^(\s*compileSdk\s*=\s*).+$',
              r'\g<1>36',
              content
          )

          if count == 0 and "compileSdk = 36" not in content:
              raise SystemExit("App compileSdk declaration not found")

          path.write_text(updated if count else content)
          print("App compileSdk is 36")
          PY

      - name: Fix file_picker compileSdk
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / ".pub-cache/hosted/pub.dev"
          files = list(root.glob("file_picker-*/android/build.gradle*"))

          if not files:
              raise SystemExit("file_picker Gradle file not found")

          for path in files:
              content = path.read_text()

              pattern = (
                  r'(?m)^([ \t]*)'
                  r'(compileSdkVersion|compileSdk)'
                  r'([ \t]*(?:=[ \t]*)?).*$'
              )

              updated, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + m.group(2) + m.group(3) + "36",
                  content
              )

              if count == 0:
                  raise SystemExit(
                      f"Could not update compileSdk in {path}"
                  )

              path.write_text(updated)
              print(f"Updated {path}")

          PY

      - name: Verify Android SDK
        run: |
          set -e
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          grep -n "compileSdk" android/app/build.gradle.kts
          flutter doctor -v

      - name: Build Mafix AI APK
        env:
          MAFIX_LIVE_TOKEN: ${{ secrets.LIVE_AUTH_TOKEN }}
        run: |
          flutter build apk --release \
            --dart-define=MAFIX_LIVE_TOKEN="$MAFIX_LIVE_TOKEN"

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mafix-AI-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
