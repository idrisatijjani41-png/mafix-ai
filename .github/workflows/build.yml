name: Build Mafix AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set compileSdk to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          content = gradle.read_text()

          content, count = re.subn(
              r'(?m)^(\s*compileSdk\s*=\s*).+$',
              r'\g<1>36',
              content
          )

          if count == 0:
              raise SystemExit("compileSdk declaration not found")

          gradle.write_text(content)
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Fix file_picker compileSdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = Path.home().glob(
              ".pub-cache/hosted/pub.dev/file_picker-*/android/build.gradle"
          )

          found = False

          for path in paths:
              found = True
              content = path.read_text()

              content = re.sub(
                  r'(?m)^(\s*compileSdkVersion\s+).+$',
                  r'\g<1>36',
                  content
              )

              content = re.sub(
                  r'(?m)^(\s*compileSdk\s*=\s*).+$',
                  r'\g<1>36',
                  content
              )

              path.write_text(content)

          if not found:
              raise SystemExit("file_picker Android Gradle file not found")
          PY

      - name: Add Internet permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\
            <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

      - name: Verify Android SDK
        run: |
          flutter doctor -v
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Build Mafix AI APK
        env:
          MAFIX_LIVE_TOKEN: ${{ secrets.LIVE_AUTH_TOKEN }}
        run: |
          flutter build apk --release \
            --dart-define=MAFIX_LIVE_TOKEN="$MAFIX_LIVE_TOKEN"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mafix-AI-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
