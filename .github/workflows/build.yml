name: Build Mafix AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create --platforms=android .

      - name: Install Android SDK 36
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)

          yes | "$SDKMANAGER" --licenses

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set compileSdk to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          content = gradle.read_text()

          content = re.sub(
              r'(?m)^(\s*compileSdk\s*=\s*).+$',
              r'\g<1>36',
              content
          )

          gradle.write_text(content)
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Fix file_picker compileSdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = Path.home().glob(
              ".pub-cache/hosted/pub.dev/file_picker-*/android/build.gradle"
          )

          for path in paths:
              content = path.read_text()

              content = re.sub(
                  r'(?m)^(\s*compileSdkVersion\s+).+$',
                  r'\g<1>36',
                  content
              )

              content = re.sub(
                  r'(?m)^(\s*compileSdk\s*=\s*).+$',
                  r'\g<1>36',
                  content
              )

              path.write_text(content)
          PY

      - name: Add Internet permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\
            <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

      - name: Verify Android SDK
        run: |
          flutter doctor -v
          sdkmanager --list

      - name: Build Mafix AI APK
        run: |
          flutter build apk --release \
            --dart-define=MAFIX_LIVE_TOKEN="${{ secrets.LIVE_AUTH_TOKEN }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mafix-AI-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
