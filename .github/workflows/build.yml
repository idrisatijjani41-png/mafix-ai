name: Build Mafix AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Generate Android project files
        run: flutter create --platforms=android .

      - name: Configure Android SDK 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_file = Path("android/app/build.gradle.kts")
          root_file = Path("android/build.gradle.kts")

          if not app_file.exists():
              raise SystemExit("ERROR: App Gradle file not found")

          if not root_file.exists():
              raise SystemExit("ERROR: Root Gradle file not found")

          # Configure app Compile SDK
          app = app_file.read_text()

          app, count = re.subn(
              r'(?m)^(\s*)compileSdk\s*=.*$',
              r'\g<1>compileSdk = 36',
              app,
              count=1
          )

          if count == 0:
              raise SystemExit("ERROR: compileSdk not found in app Gradle file")

          app_file.write_text(app)

          # Rebuild root Gradle file using valid Kotlin DSL
          root = """allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          val newBuildDir: Directory =
              rootProject.layout.buildDirectory.dir("../../build").get()

          rootProject.layout.buildDirectory.value(newBuildDir)

          subprojects {
              val newSubprojectBuildDir: Directory =
                  newBuildDir.dir(project.name)

              project.layout.buildDirectory.value(newSubprojectBuildDir)
          }

          subprojects {
              project.evaluationDependsOn(":app")
          }

          // Configure Android library modules after evaluation
          subprojects {
              afterEvaluate {
                  val androidExtension =
                      extensions.findByName("android")

                  if (androidExtension != null) {
                      val setter =
                          androidExtension.javaClass.methods.firstOrNull {
                              it.name == "setCompileSdk" &&
                              it.parameterCount == 1
                          }

                      if (setter == null) {
                          throw GradleException(
                              "Cannot configure Compile SDK 36 for $path"
                          )
                      }

                      setter.invoke(androidExtension, 36)

                      println(
                          "MAFIX SDK FIX: $path uses Compile SDK 36"
                      )
                  }
              }
          }

          tasks.register<Delete>("clean") {
              delete(rootProject.layout.buildDirectory)
          }
          """

          root_file.write_text(root)

          print("SUCCESS: App Compile SDK configured to 36")
          print("SUCCESS: Root Gradle Kotlin DSL configured")
          PY

      - name: Verify SDK configuration
        run: |
          echo "App SDK:"
          grep -n "compileSdk" android/app/build.gradle.kts

          echo "Root Gradle SDK configuration:"
          grep -n "MAFIX SDK FIX" android/build.gradle.kts

      - name: Add Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit("ERROR: AndroidManifest.xml not found")

          content = manifest.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.INTERNET"/>'
          )

          if "android.permission.INTERNET" not in content:
              content = re.sub(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n    ' + permission,
                  content,
                  count=1
              )

          manifest.write_text(content)

          print("SUCCESS: Internet permission configured")
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          MAFIX_LIVE_TOKEN: ${{ secrets.LIVE_AUTH_TOKEN }}
        run: |
          if [ -z "$MAFIX_LIVE_TOKEN" ]; then
            echo "ERROR: LIVE_AUTH_TOKEN secret is missing."
            exit 1
          fi

          flutter build apk --release \
            --dart-define=MAFIX_LIVE_TOKEN="$MAFIX_LIVE_TOKEN"

      - name: Verify APK
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "SUCCESS: Mafix AI APK generated."
          ls -lh "$APK_PATH"

      - name: Upload Mafix AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Mafix-AI-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
