name: Build Mafix AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Generate Android project files
        run: flutter create --platforms=android .

      - name: Configure Android Compile SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_file = Path("android/app/build.gradle.kts")
          root_file = Path("android/build.gradle.kts")

          if not app_file.exists():
              raise SystemExit("ERROR: App Gradle file not found")

          if not root_file.exists():
              raise SystemExit("ERROR: Root Gradle file not found")

          # Set application compileSdk to 36
          app = app_file.read_text()

          app, count = re.subn(
              r'(?m)^(\s*)compileSdk\s*=.*$',
              r'\g<1>compileSdk = 36',
              app,
              count=1
          )

          if count == 0:
              raise SystemExit("ERROR: App compileSdk setting not found")

          app_file.write_text(app)

          # Configure all Android application and library modules
          root = root_file.read_text()

          config = """
          subprojects {
              plugins.withId("com.android.application") {
                  extensions.configure<com.android.build.api.dsl.ApplicationExtension> {
                      compileSdk = 36
                  }
              }

              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.api.dsl.LibraryExtension> {
                      compileSdk = 36
                  }
              }
          }
          """

          if "Configure all Android modules to use Compile SDK 36" not in root:
              root += """
          
          // Configure all Android modules to use Compile SDK 36
          """ + config

          root_file.write_text(root)

          print("SUCCESS: App compileSdk set to 36")
          print("SUCCESS: Android library modules configured for SDK 36")
          PY

      - name: Verify Android Compile SDK
        run: |
          echo "Checking Android SDK configuration..."
          grep -n "compileSdk" android/app/build.gradle.kts
          grep -n "compileSdk = 36" android/build.gradle.kts

      - name: Add Android internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("ERROR: AndroidManifest.xml not found")

          content = manifest.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if "android.permission.INTERNET" not in content:
              content = re.sub(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n    ' + permission,
                  content,
                  count=1
              )

          manifest.write_text(content)
          print("SUCCESS: Internet permission is present.")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          MAFIX_LIVE_TOKEN: ${{ secrets.LIVE_AUTH_TOKEN }}
        run: |
          if [ -z "$MAFIX_LIVE_TOKEN" ]; then
            echo "ERROR: LIVE_AUTH_TOKEN secret is missing."
            exit 1
          fi

          flutter build apk --release \
            --dart-define=MAFIX_LIVE_TOKEN="$MAFIX_LIVE_TOKEN"

      - name: Verify APK
        run: |
          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "SUCCESS: Mafix AI APK generated."
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Mafix AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Mafix-AI-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
